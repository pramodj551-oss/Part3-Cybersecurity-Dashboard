name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PART2_RUN_ID: "33503501527"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py config pages src tests scripts

      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "app",
              "pages.Dataset_Explorer",
              "pages.EDA_Dashboard",
              "pages.Feature_Importance",
              "pages.Home",
              "pages.Model_Performance",
              "pages.Prediction",
              "src.dashboard",
              "src.explainability",
              "src.model_loader",
              "src.prediction",
              "src.preprocessing",
              "src.theme",
              "src.utils",
              "src.visualization",
          ]
          for module in modules:
              importlib.import_module(module)
              print(f"PASS import: {module}")
          print("All application modules imported successfully.")
          PY

      - name: Verify source data contract
        run: |
          python - <<'PY'
          from config.config import DATASET_PATH
          import pandas as pd
          if not DATASET_PATH.is_file():
              raise SystemExit(f"Required source dataset is missing: {DATASET_PATH}")
          df = pd.read_csv(DATASET_PATH, nrows=5)
          required = {
              "incident_id", "incident_date", "sector", "region",
              "attack_type", "threat_actor", "records_affected",
              "detection_time_hours", "ransom_demand_usd", "severity_score",
          }
          missing = sorted(required.difference(df.columns))
          if missing:
              raise SystemExit(f"Dataset contract mismatch; missing columns: {missing}")
          print(f"PASS source data contract: {DATASET_PATH}")
          PY

      - name: Download Part 2 runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: part2-runtime-artifacts
          repository: pramodj551-oss/Part2-Cybersecurity-ML-Pipeline
          run-id: ${{ env.PART2_RUN_ID }}
          github-token: ${{ secrets.PART2_ARTIFACT_TOKEN }}
          path: .part2-runtime

      - name: Install synchronized runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ".part2-runtime/models/best_model.pkl"
            ".part2-runtime/models/preprocessor.pkl"
            ".part2-runtime/models/feature_columns.pkl"
            ".part2-runtime/outputs/evaluation_report.json"
            ".part2-runtime/outputs/metrics.json"
            ".part2-runtime/outputs/feature_importance.csv"
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty synchronized artifact: $path"; exit 1; }
          done
          rm -rf models outputs
          mkdir -p models outputs
          cp .part2-runtime/models/{best_model.pkl,preprocessor.pkl,feature_columns.pkl} models/
          cp .part2-runtime/outputs/{evaluation_report.json,metrics.json,feature_importance.csv} outputs/
          echo "PASS synchronized six-file Part 2 runtime artifact contract."

      - name: Verify runtime artifact contract
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("models/best_model.pkl"),
              Path("models/preprocessor.pkl"),
              Path("models/feature_columns.pkl"),
              Path("outputs/evaluation_report.json"),
              Path("outputs/metrics.json"),
              Path("outputs/feature_importance.csv"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("Production artifact contract failed:\n" + "\n".join(missing))
          print("PASS runtime artifact contract: all six required Part 2 artifacts are present and non-empty.")
          PY

      - name: Validate loaded runtime artifacts
        run: |
          python - <<'PY'
          from src.model_loader import load_runtime_artifacts
          model, preprocessor, feature_columns = load_runtime_artifacts()
          assert callable(getattr(model, "predict", None))
          assert callable(getattr(preprocessor, "transform", None))
          assert feature_columns
          print(f"PASS loaded runtime artifacts: {len(feature_columns)} feature columns.")
          PY

      - name: Real prediction smoke test
        run: python scripts/smoke_test_prediction.py

      - name: Run unit tests
        run: pytest -q
