name: CI

on:
  push:
    branches:
      - main
      - feature/step30a-reproducibility-output-contract
      - feature/step31b-csv-resource-abuse
      - feature/step31-end-to-end-security-audit
      - feature/step32-cicd-deployment-hardening
      - feature/step35a-fix2-production-lock-contract
      - feature/step35b-runtime-artifact-hardening
      - feature/step37b-health-readiness-resilience
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PART2_REPOSITORY: "pramodj551-oss/Part2-Cybersecurity-ML-Pipeline"
  PART2_RELEASE_TAG: "part2-runtime-33513838252"
  PART2_RELEASE_COMMIT: "4c7714cff07829d5fdcee052f936045df30c23b7"
  PART2_BUNDLE_NAME: "part2-runtime-bundle.zip"
  PART2_BUNDLE_SHA256: "ece2b6bf91f19e5c0eb19475ae7198155f3fdaa4e8839ec9ab95f8cfcf031d54"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check "pytest==8.3.5"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app.py config pages src tests scripts
      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import importlib
          modules = ["app", "pages.Dataset_Explorer", "pages.EDA_Dashboard", "pages.Feature_Importance", "pages.Home", "pages.Model_Performance", "pages.Prediction", "src.csv_security", "src.dashboard", "src.explainability", "src.health", "src.model_loader", "src.prediction", "src.preprocessing", "src.theme", "src.upload_validation", "src.utils", "src.visualization"]
          for module in modules:
              importlib.import_module(module)
              print(f"PASS import: {module}")
          PY
      - name: Verify source data contract
        run: |
          python - <<'PY'
          from config.config import DATASET_PATH
          import pandas as pd
          if not DATASET_PATH.is_file(): raise SystemExit(f"Required source dataset is missing: {DATASET_PATH}")
          required = {"incident_id", "incident_date", "sector", "region", "attack_type", "threat_actor", "records_affected", "detection_time_hours", "ransom_demand_usd", "severity_score"}
          missing = sorted(required.difference(pd.read_csv(DATASET_PATH, nrows=5).columns))
          if missing: raise SystemExit(f"Dataset contract mismatch; missing columns: {missing}")
          print(f"PASS source data contract: {DATASET_PATH}")
          PY
      - name: Verify current Part 3 repository artifact identity
        run: python scripts/verify_repository_artifact_hashes.py
      - name: Verify pinned Part 2 release provenance
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${PART2_REPOSITORY}/git/ref/tags/${PART2_RELEASE_TAG}"
          actual_commit="$(curl --fail-with-body --silent --show-error --location -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Authorization: Bearer ${{ github.token }}" "$api" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$actual_commit" = "$PART2_RELEASE_COMMIT" || { echo "FAIL Part 2 release tag target: $actual_commit != $PART2_RELEASE_COMMIT"; exit 1; }
          echo "PASS Part 2 release tag target: ${PART2_RELEASE_TAG} -> ${actual_commit}"
      - name: Download pinned Part 2 runtime release
        run: |
          set -euo pipefail
          mkdir -p .part2-runtime/extracted
          url="https://github.com/${PART2_REPOSITORY}/releases/download/${PART2_RELEASE_TAG}/${PART2_BUNDLE_NAME}"
          curl --fail-with-body --silent --show-error --location "$url" -o .part2-runtime/artifacts.zip
          actual_sha256="$(sha256sum .part2-runtime/artifacts.zip | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$PART2_BUNDLE_SHA256" ]]; then echo "FAIL Part 2 bundle SHA256: $actual_sha256 != $PART2_BUNDLE_SHA256"; exit 1; fi
          echo "PASS Part 2 bundle SHA256: $actual_sha256"
      - name: Validate ZIP members before extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.validate_runtime_bundle import validate_zip_members
          archive = Path(".part2-runtime/artifacts.zip")
          validate_zip_members(archive)
          with ZipFile(archive) as zf:
              zf.extractall(".part2-runtime/extracted")
          print("PASS ZIP member security validation and extraction")
          PY
          rm -f .part2-runtime/artifacts.zip
          test -s .part2-runtime/extracted/artifact_manifest.json
      - name: Verify artifact integrity and install six-file contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path(".part2-runtime/extracted")
          manifest = json.loads((root / "artifact_manifest.json").read_text(encoding="utf-8"))
          expected = {"models/best_model.pkl", "models/preprocessor.pkl", "models/feature_columns.pkl", "outputs/evaluation_report.json", "outputs/metrics.json", "outputs/feature_importance.csv"}
          if set(manifest.get("files", {})) != expected: raise SystemExit(f"Artifact manifest contract mismatch: {sorted(manifest.get('files', {}))}")
          for relative, expected_hash in manifest["files"].items():
              path = root / relative
              if not path.is_file() or path.stat().st_size == 0: raise SystemExit(f"Missing or empty artifact: {relative}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_hash: raise SystemExit(f"SHA256 mismatch for {relative}: {actual} != {expected_hash}")
          shutil.rmtree("models", ignore_errors=True); shutil.rmtree("outputs", ignore_errors=True)
          for relative in expected:
              destination = Path(relative); destination.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(root / relative, destination)
          shutil.copy2(root / "artifact_manifest.json", Path("models/artifact_manifest.json"))
          print("PASS 6/6 Part 2 artifacts + SHA256 integrity contract")
          PY
      - name: Validate loaded runtime artifacts
        run: |
          python - <<'PY'
          from src.model_loader import load_runtime_artifacts
          model, preprocessor, feature_columns = load_runtime_artifacts()
          assert callable(getattr(model, "predict", None)); assert callable(getattr(preprocessor, "transform", None)); assert feature_columns
          print(f"PASS loaded runtime artifacts: {len(feature_columns)} feature columns.")
          PY
      - name: Health/readiness smoke test
        run: python -m scripts.health_check --json
      - name: Real prediction smoke test
        run: python scripts/smoke_test_prediction.py
      - name: Run unit tests
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check "pip-audit==2.7.3"
          python -m pip check
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt
