name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config pages src

      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import app
          import pages.Dataset_Explorer
          import pages.EDA_Dashboard
          import pages.Feature_Importance
          import pages.Home
          import pages.Model_Performance
          import pages.Prediction
          import src.dashboard
          import src.model_loader
          import src.prediction
          import src.preprocessing
          import src.theme
          import src.utils
          import src.visualization
          print("All application modules imported successfully.")
          PY

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "No tests directory yet; compile and import smoke tests passed."
          fi
