name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py config pages src

      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "app",
              "pages.Dataset_Explorer",
              "pages.EDA_Dashboard",
              "pages.Feature_Importance",
              "pages.Home",
              "pages.Model_Performance",
              "pages.Prediction",
              "src.dashboard",
              "src.model_loader",
              "src.prediction",
              "src.preprocessing",
              "src.theme",
              "src.utils",
              "src.visualization",
          ]
          for module in modules:
              importlib.import_module(module)
              print(f"PASS import: {module}")
          print("All application modules imported successfully.")
          PY

      - name: Runtime artifact contract check
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("models/best_model.pkl"),
              Path("models/preprocessor.pkl"),
              Path("models/feature_columns.pkl"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              print("Runtime artifacts are intentionally external to this repository:")
              print("\n".join(missing))
              print("Import smoke tests PASS; prediction runtime requires artifact sync.")
          else:
              print("All runtime artifacts are present.")
          PY

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "No tests directory yet; compile and import smoke tests passed."
          fi
