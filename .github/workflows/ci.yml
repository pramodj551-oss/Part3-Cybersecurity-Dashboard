name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py config pages src tests

      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "app",
              "pages.Dataset_Explorer",
              "pages.EDA_Dashboard",
              "pages.Feature_Importance",
              "pages.Home",
              "pages.Model_Performance",
              "pages.Prediction",
              "src.dashboard",
              "src.explainability",
              "src.model_loader",
              "src.prediction",
              "src.preprocessing",
              "src.theme",
              "src.utils",
              "src.visualization",
          ]
          for module in modules:
              importlib.import_module(module)
              print(f"PASS import: {module}")
          print("All application modules imported successfully.")
          PY

      - name: Verify source data contract
        run: |
          python - <<'PY'
          from config.config import DATASET_PATH
          import pandas as pd

          if not DATASET_PATH.is_file():
              raise SystemExit(f"Required source dataset is missing: {DATASET_PATH}")

          df = pd.read_csv(DATASET_PATH, nrows=5)
          required = {
              "incident_id", "incident_date", "sector", "region",
              "attack_type", "threat_actor", "records_affected",
              "detection_time_hours", "ransom_demand_usd", "severity_score",
          }
          missing = sorted(required.difference(df.columns))
          if missing:
              raise SystemExit(f"Dataset contract mismatch; missing columns: {missing}")
          print(f"PASS source data contract: {DATASET_PATH}")
          PY

      - name: Verify runtime artifact contract
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("models/best_model.pkl"),
              Path("models/preprocessor.pkl"),
              Path("models/feature_columns.pkl"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              print("SKIP runtime artifact availability: artifacts are external to this repository.")
              print("Missing artifacts:")
              print("\n".join(missing))
              print("The runtime loader is tested separately and must fail closed when artifacts are unavailable.")
          else:
              print("PASS runtime artifact availability: all required artifacts are present.")
          PY

      - name: Run unit tests
        run: pytest -q
