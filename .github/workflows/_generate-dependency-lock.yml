name: Generate dependency lock (temporary)

on:
  push:
    branches:
      - feature/step35a-fix1-dependency-lock

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Generate hashed production lock
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check "pip-tools==7.6.1"
          python -m piptools compile requirements.in --generate-hashes --output-file requirements.txt --strip-extras
          test -s requirements.txt
          grep -Eq -- '--hash=sha256:' requirements.txt
      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-requirements-lock
          path: requirements.txt
          if-no-files-found: error
