name: Sync Part 2 Runtime Artifacts

on:
  workflow_dispatch:

env:
  PART2_REPOSITORY: "pramodj551-oss/Part2-Cybersecurity-ML-Pipeline"
  PART2_RELEASE_TAG: "part2-runtime-33513838252"
  PART2_RELEASE_COMMIT: "4c7714cff07829d5fdcee052f936045df30c23b7"
  PART2_BUNDLE_NAME: "part2-runtime-bundle.zip"
  PART2_BUNDLE_SHA256: "ece2b6bf91f19e5c0eb19475ae7198155f3fdaa4e8839ec9ab95f8cfcf031d54"

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --require-hashes -r requirements.txt
          python - <<'PY'
          import joblib, numpy, pandas, sklearn
          print(f"PASS locked runtime dependencies: joblib={joblib.__version__}, numpy={numpy.__version__}, pandas={pandas.__version__}, scikit-learn={sklearn.__version__}")
          PY

      - name: Verify pinned Part 2 release provenance
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${PART2_REPOSITORY}/git/ref/tags/${PART2_RELEASE_TAG}"
          actual_commit="$(curl --fail-with-body --silent --show-error --location -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [[ "$actual_commit" != "$PART2_RELEASE_COMMIT" ]]; then
            echo "FAIL Part 2 release tag target: $actual_commit != $PART2_RELEASE_COMMIT"
            exit 1
          fi
          echo "PASS Part 2 release tag target: ${PART2_RELEASE_TAG} -> ${actual_commit}"

      - name: Download pinned Part 2 runtime release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .part2-runtime/extracted
          url="https://github.com/${PART2_REPOSITORY}/releases/download/${PART2_RELEASE_TAG}/${PART2_BUNDLE_NAME}"
          curl --fail-with-body --silent --show-error --location "$url" -o .part2-runtime/artifacts.zip
          actual_sha256="$(sha256sum .part2-runtime/artifacts.zip | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$PART2_BUNDLE_SHA256" ]]; then
            echo "FAIL Part 2 bundle SHA256: $actual_sha256 != $PART2_BUNDLE_SHA256"
            exit 1
          fi
          echo "PASS Part 2 bundle SHA256: $actual_sha256"

      - name: Validate archive members before extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.validate_runtime_bundle import validate_zip_members
          archive = Path(".part2-runtime/artifacts.zip")
          validate_zip_members(archive)
          with ZipFile(archive) as zf:
              zf.extractall(".part2-runtime/extracted")
          print("PASS ZIP member security validation and extraction")
          PY
          rm -f .part2-runtime/artifacts.zip
          test -s .part2-runtime/extracted/artifact_manifest.json

      - name: Verify SHA256 integrity and install six-file contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path(".part2-runtime/extracted")
          manifest = json.loads((root / "artifact_manifest.json").read_text(encoding="utf-8"))
          expected = {"models/best_model.pkl","models/preprocessor.pkl","models/feature_columns.pkl","outputs/evaluation_report.json","outputs/metrics.json","outputs/feature_importance.csv"}
          files = manifest.get("files", {})
          if set(files) != expected:
              raise SystemExit(f"Artifact manifest contract mismatch: {sorted(files)}")
          for relative, expected_hash in files.items():
              path = root / relative
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty artifact: {relative}")
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"SHA256 mismatch for {relative}: {actual_hash} != {expected_hash}")
          shutil.rmtree("models", ignore_errors=True)
          shutil.rmtree("outputs", ignore_errors=True)
          for relative in sorted(expected):
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / relative, destination)
          manifest_out = {"source_repository": PART2_REPOSITORY, "source_release_tag": PART2_RELEASE_TAG, "source_release_commit": PART2_RELEASE_COMMIT, "bundle_name": PART2_BUNDLE_NAME, "bundle_sha256": PART2_BUNDLE_SHA256, "files": files}
          Path("models/artifact_manifest.json").write_text(json.dumps(manifest_out, indent=2) + "\n", encoding="utf-8")
          print("PASS 6/6 Part 2 artifacts + SHA256 integrity contract")
          PY

      - name: Validate loaded runtime artifacts
        run: |
          python - <<'PY'
          from src.model_loader import load_runtime_artifacts
          model, preprocessor, feature_columns = load_runtime_artifacts()
          assert callable(getattr(model, "predict", None))
          assert callable(getattr(preprocessor, "transform", None))
          assert feature_columns
          print(f"PASS loaded runtime artifacts: {len(feature_columns)} feature columns.")
          PY

      - name: Real prediction smoke test
        run: python scripts/smoke_test_prediction.py

      - name: Open pull request for synchronized artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sync_branch="automation/part2-runtime-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$sync_branch"
          git add models outputs
          if git diff --cached --quiet; then echo "No artifact changes"; exit 0; fi
          git commit -m "chore: sync Part 2 immutable runtime artifacts"
          gh auth setup-git
          git push --set-upstream origin "$sync_branch"
          gh pr create --base main --head "$sync_branch" --title "chore: sync Part 2 immutable runtime artifacts" --body "Automated artifact sync. Runtime release tag, target commit, and SHA-256 are fixed in the workflow; CI must pass before merge."
