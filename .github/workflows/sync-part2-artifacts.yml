name: Sync Part 2 Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      part2_release_tag:
        description: "Immutable Part 2 runtime release tag"
        required: true
        default: "part2-runtime-33513838252"
        type: string

permissions:
  contents: write

env:
  PART2_REPOSITORY: "pramodj551-oss/Part2-Cybersecurity-ML-Pipeline"
  PART2_BUNDLE_NAME: "part2-runtime-bundle.zip"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas==2.2.2" \
            "numpy==1.26.4" \
            "scikit-learn==1.5.1" \
            "joblib==1.4.2"
          python - <<'PY'
          import joblib
          import numpy
          import pandas
          import sklearn
          print(f"PASS runtime dependencies: joblib={joblib.__version__}, numpy={numpy.__version__}, pandas={pandas.__version__}, scikit-learn={sklearn.__version__}")
          PY

      - name: Download immutable Part 2 runtime release
        shell: bash
        env:
          PART2_RELEASE_TAG: ${{ inputs.part2_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .part2-runtime/extracted
          url="https://github.com/${PART2_REPOSITORY}/releases/download/${PART2_RELEASE_TAG}/${PART2_BUNDLE_NAME}"
          curl --fail-with-body --silent --show-error --location "$url" -o .part2-runtime/artifacts.zip
          unzip -q .part2-runtime/artifacts.zip -d .part2-runtime/extracted
          rm -f .part2-runtime/artifacts.zip
          test -s .part2-runtime/extracted/artifact_manifest.json
          echo "PASS downloaded immutable Part 2 runtime release: ${PART2_RELEASE_TAG}"

      - name: Verify SHA256 integrity and install six-file contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path(".part2-runtime/extracted")
          manifest = json.loads((root / "artifact_manifest.json").read_text(encoding="utf-8"))
          expected = {
              "models/best_model.pkl",
              "models/preprocessor.pkl",
              "models/feature_columns.pkl",
              "outputs/evaluation_report.json",
              "outputs/metrics.json",
              "outputs/feature_importance.csv",
          }
          files = manifest.get("files", {})
          if set(files) != expected:
              raise SystemExit(f"Artifact manifest contract mismatch: {sorted(files)}")

          for relative, expected_hash in files.items():
              path = root / relative
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty artifact: {relative}")
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(
                      f"SHA256 mismatch for {relative}: {actual_hash} != {expected_hash}"
                  )

          shutil.rmtree("models", ignore_errors=True)
          shutil.rmtree("outputs", ignore_errors=True)
          for relative in sorted(expected):
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / relative, destination)
              print(f"PASS artifact: {relative}")

          manifest_out = {
              "source_repository": "pramodj551-oss/Part2-Cybersecurity-ML-Pipeline",
              "source_release_tag": "${{ inputs.part2_release_tag }}",
              "bundle_name": "part2-runtime-bundle.zip",
              "files": files,
          }
          Path("models/artifact_manifest.json").write_text(
              json.dumps(manifest_out, indent=2) + "\n", encoding="utf-8"
          )
          print("PASS 6/6 Part 2 artifacts + SHA256 integrity contract")
          PY

      - name: Validate loaded runtime artifacts
        run: |
          python - <<'PY'
          from src.model_loader import load_runtime_artifacts
          model, preprocessor, feature_columns = load_runtime_artifacts()
          assert callable(getattr(model, "predict", None))
          assert callable(getattr(preprocessor, "transform", None))
          assert feature_columns
          print(f"PASS loaded runtime artifacts: {len(feature_columns)} feature columns.")
          PY

      - name: Real prediction smoke test
        run: |
          python scripts/smoke_test_prediction.py

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models outputs
          if git diff --cached --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore: sync Part 2 immutable runtime artifacts"
          git push
