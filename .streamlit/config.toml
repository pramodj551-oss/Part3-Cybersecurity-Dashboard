# Streamlit configuration for the cybersecurity dashboard.

[theme]
primaryColor = "#1565C0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#212121"
font = "sans serif"

[server]
headless = true
runOnSave = false
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[runner]
fastReruns = true
